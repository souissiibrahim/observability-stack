[agent]
  interval = "10s"
  round_interval = true
  hostname = "telegraf-agent"
  flush_interval = "10s"
  flush_jitter = "5s"
  logfile = "/var/log/telegraf/telegraf.log"  # Enable logging for debugging
  debug = true  # Enable debug mode

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = ""
  organization = ""
  bucket = "metrics"
  timeout = "10s"  # Ensure connection stability

[[inputs.prometheus]]
  urls = [
    "http://node-exporter:9100/metrics",
    "http://cadvisor:8080/metrics"
  ]
  name_override = "prometheus_metrics"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true
  fielddrop = ["usage_guest", "usage_guest_nice"]

[[inputs.mem]]
  fieldinclude = ["used_percent"]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay"]
  mount_points = ["/", "/home", "/var/lib/docker"]

[[inputs.nstat]]

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  container_name_include = []  # Fixed deprecated option
  timeout = "5s"
  gather_services = true  # Enable service discovery
  perdevice_include = []  # Fixed deprecated "perdevice"
  total = false

[[inputs.system]]
  fieldexclude = ["uptime_format"]  # Fixed deprecated option

[[inputs.procstat]]
  pattern = ".*"
  tag_with = ["pid"]  # Fixed deprecated "pid_tag"

# Add internal metrics to debug Telegraf itself
[[inputs.internal]]
