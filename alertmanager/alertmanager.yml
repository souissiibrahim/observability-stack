global:
  resolve_timeout: 5m


  smtp_smarthost: ''
  smtp_from: ''
  smtp_auth_username: ''
  smtp_auth_password: ''
  smtp_require_tls: true

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'grafana-oncall'

  routes:
    - match:
        severity: critical
      receiver: 'email-alerts'

    - match:
        severity: warning
      receiver: 'grafana-oncall'

receivers:

  - name: 'grafana-oncall'
    webhook_configs:
      - url: "http://grafana-oncall:8080/api/v1/alerts"


  - name: 'email-alerts'
    email_configs:
      - to: ''
        send_resolved: true
